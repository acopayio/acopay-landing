    <!-- One canonical host per product: www → apex (.net wallet + .org coin) -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === "www.acopay.net") {
          location.replace(
            "https://acopay.net" + location.pathname + location.search + location.hash
          );
          return;
        }
        if (h === "www.acopay.org") {
          location.replace(
            "https://acopay.org" + location.pathname + location.search + location.hash
          );
          return;
        }
        // Phase A: when served on coin host, rewrite static SEO that still says .net
        // and restore Acopay.org in keywords (wallet host omits org).
        if (h === "acopay.org") {
          try {
            var from = "https://acopay.net";
            var to = "https://acopay.org";
            document.querySelectorAll('link[rel="canonical"], link[rel="alternate"]').forEach(function (el) {
              var href = el.getAttribute("href");
              if (href && href.indexOf(from) === 0) el.setAttribute("href", to + href.slice(from.length));
            });
            document.querySelectorAll('meta[property="og:url"], meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"], meta[name="twitter:url"]').forEach(function (el) {
              var c = el.getAttribute("content");
              if (!c) return;
              if (c.indexOf(from) === 0) el.setAttribute("content", to + c.slice(from.length));
              // Coin host keeps token OG card (not wallet screenshot).
              if (c.indexOf("/assets/og-wallet.png") >= 0) {
                el.setAttribute("content", to + "/assets/og-card.png?v=20260728i");
              }
            });
            var ogAltEls = document.querySelectorAll('meta[property="og:image:alt"], meta[name="twitter:image:alt"]');
            ogAltEls.forEach(function (el) {
              el.setAttribute("content", "ACOPAY — Pay your way");
            });
            var kw = document.querySelector('meta[name="keywords"]');
            if (kw) {
              kw.setAttribute(
                "content",
                "ACOPAY, Pay your way, Solana, Token-2022, non-custodial wallet, payment utility, wallet to wallet, SPL token, Acopay.org"
              );
            }
            var mf = document.querySelector('link[rel="manifest"]');
            if (mf) mf.setAttribute("href", "/site-coin.webmanifest");
          } catch (e) {}
        }
      })();
    </script>
    <!-- Theme before paint — avoid flash; default Light -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("acopay_theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
